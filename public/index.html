<!DOCTYPE html>
<html lang="en">

<head>
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="manifest" href="/assets/site.webmanifest">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAY ROBERTS AI</title>

    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu:400,700">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

<div class="logo-icon">

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

    <path
        d="M25 80V20H52
           C68 20 76 27 76 38
           C76 45 71 50 63 52
           C72 54 78 59 78 68
           C78 76 69 80 53 80H25ZM25 52H51
           C61 52 67 47 67 39
           C67 32 61 28 51 28H25"
        fill="none"
        stroke="white"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

</svg>

</div>
            <div>

                <h2 class="ubuntu-logo">BAY ROBERTS AI</h2>
                <p>Offline AI Document Assistant</p>

            </div>

        </div>

        <div class="upload-box">

            <h3 style="margin-left: 5px;" >Upload Document</h3>

            <br>

            <input
    type="file"
    id="pdfFile"
    accept=".pdf,.png,.jpg,.jpeg,.webp"
    hidden
>

<label
    for="pdfFile"
    class="chooseFileButton"
>


Choose File

</label>



            <button class="uploadbuttonpadding" onclick="uploadFile(document.getElementById('pdfFile').files[0])">
    Upload
</button>
<center><button class="cameraButton" onclick="openCamera()">
    📷 Scan Document
</button></center>
<br><p></p>
            <p id="uploadStatus" style="margin-top: 10px;"></p>

        </div>

        <h3 class="documents-title">

            Documents

        </h3>

        <div id="documentList">

        </div>

    </aside>


    <main class="chat">

        <div class="chat-header">

            <div>

            </div>

            <div class="status">

                <span class="status-dot"></span>

                Local

            </div>

        </div>


<div id="chatMessages">

    <div class="welcome">

        <h2>Welcome 👋</h2>

        <p>
            Drag and drop files or Upload documents on the left and ask me anything.
        </p>

    </div>

</div>


        <div class="chat-input">

            <input
                id="question"
                placeholder="Ask anything..."
            >

            <button onclick="sendQuestion()">

                Send →

            </button>

        </div>

    </main>

</div>
<div id="dragOverlay">
    <div>
        📄
        <h2>Drop files to upload</h2>
        <p>PDFs and images supported</p>
    </div>
</div>
<script src="script.js"></script>

<div id="cameraModal" class="cameraModal">

    <div class="cameraWindow">

        <video id="cameraVideo" autoplay playsinline></video>

        <canvas id="cameraCanvas" hidden></canvas>

        <div class="cameraButtons">

            <button onclick="capturePhoto()">
                Capture
            </button>

            <button onclick="closeCamera()">
                Cancel
            </button>

        </div>

    </div>

</div>
<div id="previewModal" class="previewModal">

    <div class="previewWindow">

        <button
            class="closePreview"
            onclick="closePreview()">

            ✕

        </button>

        <div id="previewContent"></div>

    </div>

</div>

</body>

</html>
